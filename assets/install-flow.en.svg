<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1180" viewBox="0 0 960 1180" role="img" aria-labelledby="t d">
<title id="t">Aqua theme — Install flow</title>
<desc id="d">Install flow for the DSH desktop app: open the app, open the plugin manager, add the plugin, wait, fully quit, reopen, then verify the glass theme is active.</desc>
